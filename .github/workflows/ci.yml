name: Validate Agora Match
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: node --check static/app.js && node --check static/experience.js && node --check static/evidence.js
      - run: python -m agora_match.build_site
      - run: node tests/browser_evidence.cjs
      - run: python scripts/preflight.py
      - run: python scripts/preflight.py --parameters infra/parameters.trial.json
      - run: bash -n scripts/deploy-azure.sh
      - run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag agora-match:ci .
      - name: Exercise the container without Azure credentials
        run: |
          docker run -d --name agora-ci -p 8080:8080 agora-match:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/health/ready >/dev/null; then break; fi
            sleep 2
          done
          python scripts/smoke_azure.py --url http://127.0.0.1:8080
          docker stop agora-ci
      - name: Export the tested image for trial subscriptions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker save agora-match:ci | gzip -1 > agora-match-image.tar.gz
          sha256sum agora-match-image.tar.gz > agora-match-image.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: agora-match-container
          path: |
            agora-match-image.tar.gz
            agora-match-image.tar.gz.sha256
          compression-level: 0
          retention-days: 3
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: azure/CLI@v2
        with:
          inlineScript: |
            az bicep install --version v0.48.1
            az bicep build --file infra/main.bicep --stdout >/dev/null
