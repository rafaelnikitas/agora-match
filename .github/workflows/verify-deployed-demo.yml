name: Verify deployed Agora demo
# Manual only: invokes real models and consumes the demo's Azure credit.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agora-public-demo-verification
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGORA_DEMO_URL: ${{ vars.AGORA_DEMO_URL || 'https://agora-demo-d3ysdvzmwpuoi.orangewater-9594c3f1.swedencentral.azurecontainerapps.io' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Require a fresh model execution
        run: python scripts/smoke_azure.py --url "$AGORA_DEMO_URL" --require-ai
      - name: Exercise both fixtures and all audiences
        run: python scripts/evaluate.py --url "$AGORA_DEMO_URL" --require-ai --pause-seconds 10 --output build/azure-live-evaluation.json
      - name: Retain execution evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agora-deployed-demo-evaluation
          path: build/azure-live-evaluation.json
          if-no-files-found: warn
          retention-days: 30
